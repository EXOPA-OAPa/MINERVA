# MINERVA example 04_bootstrap
# Stellar parameters resampled within their uncertainties at every simulation
#
# Run from the repository root:
#   python scripts/run_minerva.py examples/04_bootstrap/config.yaml
# Results in examples/04_bootstrap/results/. Paths are relative to this file.

paths:
  data_dir: ../../data
  user_dir: .
  output_dir: results
run_options:
  debug_plot: false
  debug_fit_plot: false
  export_debug_pdf: false
  show_on_screen: false
  debug_pdf_all_iter: false
  bootstrap: true
  rv_series_pdf: 2
  n_workers: 1
analysis:
  n_start: 10
  step: 5
  sampling_strategy: sequential
  fap_star: 0.1
  fap_planet: 0.5
  delta_bic_threshold: 6.0
  random_seed: 42
  gls_method: recurrence
general_variables:
  name_sampling: harps.rv
  name_sampling_usp: time_usp.txt
  inputfile_nsts: NSTS_noise_new.txt
  inputfile_mass_age: max_age_from_mass.dat
  inputfile_activity: PLOT_POINTS_DATA_KG-KP-M-MP-YO-OC-KP-SO.csv
  sig_floor: 0.5
  sig_pl: 2
  sig_best:
  - 5
  - 5.5
  n_iterations: 100
read_catalog: false
single_target: true
single_target_params:
  targetname: M_star_bootstrap
  real_cadence: false
  star_mass: 0.55
  err_star_mass: 0.03
  star_radius: 0.54
  err_star_radius: null
  star_temp: 3800
  err_star_temp: 80
  sp: M1
  v_mag: 10.2
  gaia_mag: null
  pl_mass_Mj: null
  pl_mass_Me: 12
  pl_period: 9.7
  err_pl_period: null
  transit_midpoint: 9001.3
  pl_radius_Rj: null
  pl_radius_Re: null
  eccentricity: null
  periastron: null
  age: null
  err_age: null
  vsini_tag: null
  Prot: null
  err_Prot: null
  log_Rhk: -4.9
  err_log_Rhk: 0.1
  K_act: null
