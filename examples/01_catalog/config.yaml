# MINERVA example 01_catalog
# Catalog of targets with their own cadences: survey planning
#
# Run from the repository root:
#   python scripts/run_minerva.py examples/01_catalog/config.yaml
# Results in examples/01_catalog/results/. Paths are relative to this file.

paths:
  data_dir: ../../data
  user_dir: .
  output_dir: results
run_options:
  debug_plot: false
  debug_fit_plot: false
  export_debug_pdf: false
  show_on_screen: false
  debug_pdf_all_iter: false
  bootstrap: false
  rv_series_pdf: 2
  n_workers: auto
analysis:
  n_start: 10
  step: 5
  sampling_strategy: sequential
  fap_star: 0.1
  fap_planet: 0.5
  delta_bic_threshold: 6.0
  random_seed: 42
  gls_method: recurrence
general_variables:
  name_sampling: harps.rv
  name_sampling_usp: time_usp.txt
  inputfile_nsts: NSTS_noise_new.txt
  inputfile_mass_age: max_age_from_mass.dat
  inputfile_activity: PLOT_POINTS_DATA_KG-KP-M-MP-YO-OC-KP-SO.csv
  sig_floor: 0.5
  sig_pl: 2
  sig_best:
  - 5
  - 5.5
  n_iterations: 100
read_catalog: true
single_target: false
catalog:
  namecatalog: catalog_example.csv
  real_cadence: true
single_target_params:
  targetname: example
  real_cadence: false
  star_mass: 1.0
  err_star_mass: null
  star_radius: null
  err_star_radius: null
  star_temp: 5800
  err_star_temp: null
  sp: G2
  v_mag: 9.0
  gaia_mag: null
  pl_mass_Mj: null
  pl_mass_Me: 20
  pl_period: 12.0
  err_pl_period: null
  transit_midpoint: 9003.4
  pl_radius_Rj: null
  pl_radius_Re: null
  eccentricity: null
  periastron: null
  age: null
  err_age: null
  vsini_tag: null
  Prot: null
  err_Prot: null
  log_Rhk: -4.8
  err_log_Rhk: null
  K_act: null
